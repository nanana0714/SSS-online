<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Super Shooter Stars (SSS)</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1030;--ink:#fff;--gd:#ffd23f;--me:#27b6ff;--rv:#ff5a5a;--lock:#7b7e8a;--low:#c9ccd6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#05061a;color:var(--ink);font-family:"DotGothic16","Hiragino Sans","Yu Gothic",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{position:absolute;left:0;top:0;width:390px;height:867px;padding:104px 0;transform-origin:0 0;display:flex;flex-direction:column;background:linear-gradient(#0d1030,#17194a);overflow:hidden}
#mdl{position:absolute;right:10px;bottom:78px;font-size:12px;color:#8a90b8}
.hidden{display:none!important}
.screen{position:absolute;inset:0;z-index:6;background:#16222f;display:flex;flex-direction:column;align-items:center;padding:18px 16px;overflow:auto}
h1{margin:6px 0;font-size:40px;line-height:1.05;text-align:center;color:var(--gd);text-shadow:3px 3px 0 #000,0 0 14px #ff9f1a}
.lead{color:#b8c4d6;font-size:13px;text-align:center;line-height:1.6;margin:6px 0 12px}
#card{width:100%;border:3px dashed var(--gd);border-radius:14px;padding:12px;text-align:center;background:#1b2b3d}
#card .cn{font-size:30px;color:var(--gd);text-shadow:2px 2px 0 #000;margin-top:4px}
#card .cd{font-size:12px;color:var(--gd);margin:2px 0 10px}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{background:var(--me);border-radius:6px;padding:6px 2px;line-height:1.2}
.chip span{font-size:12px;display:block;min-height:30px}.chip b{font-size:24px}.chip i{display:block;font-style:normal;font-size:11px;color:#ffe48a;min-height:14px}
#icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:14px 0;width:100%}
#icons canvas{width:100%;aspect-ratio:1;background:#223244;border:2px solid #7e6b1a;border-radius:6px}
#icons canvas.sel{border-color:var(--gd);background:#3a3a22}
#oicons{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:0 0 14px;width:100%}#oicons canvas{width:100%;aspect-ratio:1;background:#223244;border:2px solid #6b3a3a;border-radius:6px}#oicons canvas.sel{border-color:var(--rv);background:#3a2222}
.btn{font:inherit;font-size:20px;color:#2a2200;background:var(--gd);border:0;border-radius:8px;padding:13px;width:100%;max-width:320px;margin-top:6px;box-shadow:0 4px 0 #8a6a00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6a00}.btn.alt{background:#8fa3b8;box-shadow:0 4px 0 #4b5a6b;color:#fff}
#modes,#diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:320px;margin-bottom:6px}#diff{grid-template-columns:1fr 1fr 1fr 1fr}#modes button,#diff button{font:inherit;font-size:15px;color:#fff;background:#223244;border:2px solid #3b4d63;border-radius:8px;padding:8px 2px;line-height:1.3}#modes button small,#diff button small{display:block;font-size:11px;color:#9fb0c4}#modes button.sel,#diff button.sel{border-color:var(--gd);background:#3a3a22;color:var(--gd)}
.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#0a0b22}
.b{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lock);color:#fff;text-align:center;line-height:1.1;touch-action:manipulation}
.b .nm{font-size:13px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}.b b{font-size:28px;font-weight:400;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.b .pp{font-style:normal;font-size:11px;letter-spacing:2px;color:#555d70;min-height:13px}.b .pp u{text-decoration:none;color:#ffb400}
.b.low{background:var(--low)}.b.low .pp{color:#8b92a3}
.b.rdy.me{background:var(--me)}.b.rdy.rv{background:var(--rv)}.b.rdy .pp{color:#ffe48a}
#pm .b:active{filter:brightness(1.15)}
.eb{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:3px;background:#101226;height:28px}
.eb span{background:#22263d}.eb em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;text-shadow:2px 2px 0 #000}
.eb.me span.on{background:var(--me)}.eb.rv span.on{background:var(--rv)}
#cv{flex:1;min-height:0;width:100%;display:block}
#msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:56px;color:var(--gd);text-shadow:4px 4px 0 #000;pointer-events:none;z-index:3}
#warn{position:absolute;left:50%;transform:translateX(-50%);top:34px;background:#d62839cc;font-size:11px;padding:2px 12px;border-radius:99px;z-index:3;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.35}}
#vs{position:absolute;inset:0;z-index:5;pointer-events:none}
.vb{position:absolute;left:0;right:0;height:34%;display:flex;align-items:center;padding:0 22px;font-size:30px;text-shadow:3px 3px 0 #000}
.vb.r{top:20%;background:var(--rv);justify-content:flex-end;animation:inL .35s ease-out}
.vb.m{top:46%;background:var(--me);animation:inR .35s ease-out}
.vt{position:absolute;left:0;right:0;top:41%;text-align:center;font-size:76px;text-shadow:4px 4px 0 #000;animation:pop .5s}
@keyframes inL{from{transform:translateX(-110%)}}@keyframes inR{from{transform:translateX(110%)}}@keyframes pop{from{transform:scale(3);opacity:0}}
#cut{position:absolute;inset:0;z-index:5;pointer-events:none}#cut .band{position:absolute;left:0;right:0;top:34%;height:130px;background:linear-gradient(90deg,#1c6dff,#8a3cff);display:flex;align-items:center;gap:12px;padding:0 14px;animation:inL .25s ease-out;border-top:4px solid #fff;border-bottom:4px solid #fff}#cut.rv .band{background:linear-gradient(90deg,#ff3b5c,#ff9a3d);flex-direction:row-reverse;animation:inR .25s ease-out}#cut .tx{font-size:30px;text-shadow:3px 3px 0 #000;flex:1;text-align:center}
.snd{position:absolute;right:10px;top:10px;z-index:9;font:inherit;font-size:14px;background:#0d1030cc;border:2px solid #fff;border-radius:99px;padding:1px 10px;color:#fff;box-shadow:0 2px 0 #000}.snd:active{transform:translateY(1px);box-shadow:0 1px 0 #000}#game .snd{right:auto;left:6px;top:6px}
#set{position:absolute;left:6px;top:6px;z-index:4;display:flex;align-items:center;gap:4px;font:inherit;font-size:11px;color:#fff;background:#0d1030cc;border:2px solid #fff;border-radius:99px;padding:1px 10px 1px 6px;box-shadow:0 2px 0 #000;text-shadow:1px 1px 0 #000}#set:active{transform:translateY(1px);box-shadow:0 1px 0 #000}#set canvas{width:18px;height:18px;image-rendering:pixelated}#tm{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:20px;color:#fff;text-shadow:2px 2px 0 #000;z-index:3;pointer-events:none}
#setp{position:absolute;inset:0;z-index:8;background:#05061acc;display:flex;align-items:center;justify-content:center}#setp .box{background:#16222f;border:3px solid var(--gd);border-radius:14px;padding:18px 20px;width:84%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px}#setp h2{margin:0 0 6px;color:var(--gd);font-size:28px;font-weight:400}
.screen{padding:34px 8px 30px}
h1{font-size:30px;margin:4px 0 2px}
.lead{font-size:11px;margin:2px 0 8px;line-height:1.5}
#card{padding:8px 10px;border-width:2px}
#card .cn{font-size:22px;margin-top:2px}
#card .cd{font-size:11px;margin:0 0 6px}
#cp canvas{width:56px!important;height:56px!important;image-rendering:pixelated}
.chip{padding:3px 2px}.chip span{font-size:11px;min-height:26px}.chip b{font-size:18px}.chip i{font-size:10px;min-height:12px}
#icons{grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0 4px}
#oicons{grid-template-columns:repeat(9,1fr);gap:4px;margin:0 0 6px}
#icons canvas,#oicons canvas{border-width:2px;image-rendering:pixelated}
#diff,#modes{margin-bottom:6px;gap:6px}
#modes button,#diff button{font-size:13px;padding:5px 2px}
#modes button small,#diff button small{font-size:10px}
.btn{font-size:18px;padding:11px}
#setp .box{width:72%;max-width:270px;padding:12px 14px;gap:6px}#setp h2{font-size:20px;margin:0 0 4px}#setp .btn{font-size:15px;padding:9px;margin-top:0}
#res h2{font-size:34px}#res .btn{font-size:16px;padding:10px}
#onlp input{font:inherit;font-size:24px;text-align:center;width:60%;max-width:200px;padding:6px;border-radius:8px;border:3px solid var(--gd);background:#0d1030;color:#fff;letter-spacing:8px;margin:8px 0}.btn:disabled{opacity:.4}
#st,#modesel,#onlp{justify-content:center}
#res{justify-content:center;background:#05061aee}
#res h2{font-size:42px;margin:6px 0;color:var(--gd);text-shadow:3px 3px 0 #000}
</style>
</head>
<body>
<div id="app">
  <div id="st" class="screen">
    <button class="snd">🔊</button>
    <canvas id="hc" width="108" height="108" style="width:108px;height:108px;image-rendering:pixelated"></canvas>
    <h1 style="font-size:72px;margin:16px 0 0;letter-spacing:6px">SSS</h1>
    <div style="font-size:19px;color:#ffe48a;text-shadow:2px 2px 0 #000;margin:2px 0 8px">Super Shooter Stars</div>
    <p class="lead" style="margin-bottom:28px">ドット絵の1対1・対戦シューティング</p>
    <button class="btn" id="hstart" style="font-size:24px;padding:18px">スタート</button>
  </div>
  <div id="modesel" class="screen hidden">
    <h1 style="font-size:28px;margin-bottom:18px">あそぶモード</h1>
    <button class="btn" id="mcpu" style="font-size:22px;padding:22px;margin-bottom:10px">CPUとたたかう</button>
    <button class="btn" id="mon" style="font-size:22px;padding:22px;margin-bottom:10px">オンラインでたたかう</button>
    <button class="btn alt" id="mbk">もどる</button>
  </div>
  <div id="title" class="screen hidden">
    <h1 style="font-size:34px">SSS</h1><button class="snd">🔊</button>
    <p class="lead">画面タップで方向転換、下のパネルでスキル発動。<br>数字ボックスを割ると★が落ちる。取るとパワーアップ！<br>スタンダードは1発で決着、パーティはライフ3つ。</p>
    <div id="card"><div id="cp"></div><div class="cn" id="cn"></div><div class="cd" id="cd"></div><div id="chips"></div></div>
    <div id="icons"></div>
    <div id="sec-opp" style="width:100%"><div class="lead" style="margin:0 0 6px">対戦相手</div><div id="oicons"></div></div>
    <div id="sec-diff" style="width:100%"><div class="lead" style="margin:0 0 4px">CPUの強さ</div><div id="diff"><button data-d="0">ふつう</button><button data-d="1">つよい</button><button data-d="2">最強</button><button data-d="3">鬼</button></div></div>
    <div id="modes"><button data-m="std">スタンダード<small>1発で決着</small></button><button data-m="party">パーティモード<small>ライフ3・高速・全解放</small></button></div>
    <p class="lead hidden" id="olst" style="margin:4px 0;white-space:pre-line;min-height:34px"></p>
    <button class="btn" id="go">バトルスタート</button>
    <button class="btn alt" id="tbk">もどる</button>
  </div>
  <div id="game" class="hidden" style="display:contents">
    <div id="mdl"></div>
    <div class="sp" id="pr"></div><div class="eb rv" id="br"></div>
    <div style="position:relative;flex:1;min-height:0;display:flex">
      <button id="set"><canvas id="gearc" width="18" height="18"></canvas><span>設定</span></button><div id="tm">0:00</div><canvas id="cv"></canvas><div id="warn" class="hidden">⚠ 距離が縮まっています</div><div id="msg"></div>
    </div>
    <div class="sp" id="pm"></div><div class="eb me" id="bm"></div>
  </div>
  <div id="onlp" class="screen hidden">
    <h1 style="font-size:26px">オンライン対戦</h1>
    <p class="lead" id="onst" style="white-space:pre-line;min-height:50px"></p>
    <button class="btn" id="onmk">部屋を作る（ホスト）</button>
    <input id="oncode" inputmode="numeric" maxlength="4" placeholder="0000">
    <button class="btn" id="onjn">コードで入室</button>
    <button class="btn alt" id="onbk">もどる</button>
  </div>
  <div id="setp" class="hidden"><div class="box"><h2>設定</h2><button id="sndset" class="btn alt">サウンド：ON</button><button id="exitg" class="btn alt">ゲームから退出</button><button id="closeset" class="btn">ゲームに戻る</button></div></div>
  <div id="cut" class="hidden"><div class="band"><canvas id="cutc" width="90" height="90"></canvas><span class="tx">ポーズは完璧！</span></div></div>
  <div id="vs" class="hidden"><div class="vb r"><span id="vr"></span></div><div class="vt">VS</div><div class="vb m"><span id="vm"></span></div></div>
  <div id="res" class="screen hidden">
    <h2 id="rt"></h2><p class="lead" id="rd"></p>
    <button class="btn" id="again">もう一度対戦</button><button class="btn alt" id="home">メニューへ</button>
  </div>
</div>
<script>
const SPR={
star:['....#....','....#....','...###...','##e###e##','.#######.','..#####..','..#####..','.###.###.','.##...##.'],
bunny:['.##...##.','.##...##.','.##...##.','.#######.','##e###e##','#########','.#######.','.#######.','..#...#..'],
squid:['..#####..','.#######.','#########','##e###e##','#########','.#######.','.#.#.#.#.','.#.#.#.#.','#..#.#..#'],
robot:['....#....','....#....','.#######.','#########','##e###e##','#########','#########','.#######.','.##...##.'],
curl:['..#####..','.#######.','###eee###','##e###e##','##e#e#e##','##e###e##','###eee###','.#######.','..#####..'],
storm:['..#####..','.#######.','##e###e##','#########','.#######.','...###...','..###....','...###...','..#......'],
cat:['#.......#','##.....##','#########','#########','#e#####e#','#########','.#######.','..#####..','..#...#..'],
subaru:['..#.#.#..','...###...','.#######.','##e###e##','#########','.#######.','..#####..','.##...##.','.#.....#.'],
gear:['...###...','.#.###.#.','.#######.','###...###','###...###','###...###','.#######.','.#.###.#.','...###...'],
rein:['...###...','..#####..','..#e#e#..','..#####..','#########','#.#####.#','..#####..','..##.##..','.##...##.'],
witch:['....#....','...###...','..#####..','#########','.#######.','.#e###e#.','.#######.','..#####..','.#######.'],
dagger:['....#....','...###...','...###...','...###...','...###...','..#####..','.#######.','....#....','....#....'],
ikemen:['.#######.','#########','#########','#eee#eee#','#########','##eeeee##','.#######.','..#####..','...###...'],
king:['#.#.#.#.#','#########','.#######.','.#e###e#.','.#######.','..#####..','.#######.','#########','##.....##'],
seer:['....#....','...###...','..#####..','.#######.','#########','.#e###e#.','.#######.','.#.###.#.','..#...#..'],
mitt:['.#.#.#.#.','.#.#.#.#.','#########','#########','##e###e##','#########','.#######.','..#####..','..#####..'],
ninja:['..#####..','.#######.','#########','#eeeeeee#','.#######.','..#####..','.#######.','#.#####.#','..#...#..']};
const CH=[
 {n:'ニャンタ',k:'bunny',sp:105,d:'扱いやすい標準型',s:[['ショット',0,'single',1],['ダブル',2,'double',3],['3WAY',5,'spread',6]]},
 {n:'ピポパ',k:'squid',sp:100,d:'曲がる弾と急加速弾',s:[['ショット',0,'single',1],['ジグザグ',1,'zig',2],['ワープ弾',4,'warp',5]]},
 {n:'メカロボ',k:'robot',sp:88,d:'巨大弾とシールド',s:[['ショット',0,'single',1],['ヘビー弾',3,'heavy',4],['シールド',6,'shield',7]]},
 {n:'ニンジャ',k:'ninja',sp:118,d:'高速移動と分身攻撃',s:[['クナイ',0,'kunai',1],['反転ダッシュ',2,'dash',2],['分身ショット',6,'clone',8]]},
 {n:'火を追う英雄',k:'star',sp:108,d:'弾幕を張って一気に起爆',s:[['黎明ショット',0,'dawnshot',2],['ドーンメイカー',2,'dawnmaker',4],['太陽を穿つ',4,'sunpierce',7]]},
 {n:'マイト･ペルー',k:'mitt',sp:100,d:'弾を呼び戻して回復する技巧派',s:[['地味ショット',0,'plain',1],['秘技！ブーメラン',1,'boom',3],['見たかよ',4,'catcher',5]]},
 {n:'占星術師',k:'seer',sp:98,d:'绁星を集めて大きな願いを放つ',s:[['ショット',0,'plain',1],['三叉路の運命',1,'fate',3],['お星様の願いを',3,'wish',5]]},
 {n:'唯我独尊王',k:'king',sp:96,d:'ゲートで弾を並べて一斉発射',s:[['ゲート',0,'gate',1],['ゲートマックス',2,'gatemax',3],['神縛り',4,'kami',7]]},
 {n:'イケ･メン',k:'ikemen',sp:104,d:'お金とイケメン力で押し切る',s:[['成り金ショット',0,'rich',3],['全部買いだ！',1,'allbuy',1],['ポーズは完璧',5,'pose',10]]},
 {n:'フューリー･タガー',k:'dagger',sp:112,d:'不可視のナイフと矢の雨',s:[['極秘術',0,'wig',2],['シリアスナイフ',2,'knife',4],['矢の雨',4,'rain',7]]},
 {n:'憂鬱の魔女',k:'witch',sp:96,d:'圧縮して一気に解き放つ',s:[['圧縮ショット',0,'cshot',2],['圧縮回避',2,'cdash',2],['コンプレスアゴニー',5,'agony','X']]},
 {n:'ラインハルト',k:'rein',sp:104,d:'星で加護を授かる剣士',s:[['斬撃(左)',0,'slashL',2],['斬撃(右)',0,'slashR',2],['最強',3,'saikyo',10]]},
 {n:'クルックル',k:'curl',sp:106,d:'弧を描く弾とらせん弾',s:[['ライトー',0,'arcR',2],['レフトー',1,'arcL',2],['でぃーえぬえー',3,'dna',5]]},
 {n:'スバル',k:'subaru',sp:100,d:'見えざる手で箱を操る',s:[['剛速球',0,'fast',2],['見えざる手',2,'hand',4],['愛してる',5,'love',7]]},
 {n:'テルミヌス',k:'cat',sp:102,d:'猫たちが弾を放つ',s:[['猫ショット',0,'catshot',2],['黒猫',1,'bcat',4],['終焉を描く',4,'finale',6]]},
 {n:'嵐',k:'storm',sp:108,d:'弓で狙撃の威力を高める',s:[['狙撃',0,'snipe',2],['帝弓',2,'bow',5],['流れ星',5,'meteor',8]]}
];
const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d'),SPEED=.6,MV=.5,CDMS=600,ME='#27b6ff',RV='#ff5a5a';
let W,H,me,cpu,B,BX,SH,ST,FX,TX,SW,Q,T,dist,minD,state='title',sel=0,osel=-1,mode='std',lvl=1,party=false,seerOn=false,nextBox,last,aiT;
function spr(c,k,cx,cy,px,col,fl){const m=SPR[k],ov=px%1?.7:0;c.save();for(let pass=0;pass<2;pass++){c.fillStyle=pass?'#0d1030':(fl?'#fff':col);for(let r=0;r<9;r++)for(let q=0;q<9;q++){const ch=m[r][q];if(ch==='.'||(ch==='e')!==!!pass)continue;const o=pass?0:ov;c.fillRect(cx+(q-4.5)*px,cy+(r-4.5)*px,px+o,px+o)}}c.restore()}
const pips=(s,st)=>s[1]?Array.from({length:Math.min(s[1],6)},(_,k)=>k<st?'<u>★</u>':'☆').join(''):'&nbsp;';
// title
$('icons').innerHTML=[0,...CH].map((c,i)=>`<canvas width="40" height="40" data-i="${i-1}"></canvas>`).join('');
function pick(i){sel=i;const c=i<0?{n:'ランダム',k:null,d:'毎回ランダムなキャラで出撃',s:[]}:CH[i];
  document.querySelectorAll('#icons canvas').forEach((cn,j)=>{const on=j-1===i,x=cn.getContext('2d');cn.classList.toggle('sel',on);x.clearRect(0,0,40,40);if(j===0){x.fillStyle=on?'#ffd23f':'#8c97aa';x.font='26px DotGothic16,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',20,22)}else spr(x,CH[j-1].k,20,20,4,on?'#ffd23f':'#8c97aa')});

  for(const s of SW){if(s.cat){spr(g,'cat',s.cat.x,s.cat.y,3,s.cat.c);continue}if(s.bm){g.save();g.strokeStyle=s.bm.c;g.lineWidth=6;g.globalAlpha=Math.min(1,s.t*5);g.beginPath();g.moveTo(s.bm.x,s.bm.y1);g.lineTo(s.bm.x,s.bm.y2);g.stroke();g.restore();continue}const p=s.p,k=Math.min(1,1-s.t/.25);g.save();g.strokeStyle='#fff';g.lineWidth=7;g.lineCap='round';g.globalAlpha=Math.min(1,s.t*6);g.beginPath();for(let i=0;i<=10;i++){const u=s.d+(-2*s.d*k)*(i/10),a=-p.side*Math.PI/2+p.side*u*1.05,X=p.x+Math.cos(a)*58,Y=p.y+Math.sin(a)*58;i?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke();g.restore()}
  g.font='18px DotGothic16,sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(const t of TX){g.globalAlpha=Math.min(1,t.l*2);g.fillStyle='#000';g.fillText(t.s,t.x+1,t.y+1);g.fillStyle=t.c;g.fillText(t.s,t.x,t.y)}g.globalAlpha=1;
}
function loop(n){
  if(state==='title')return;
  const dt=Math.min(.033,(n-last)/1000);last=n;
  if(state==='play'||state==='cut')el+=dt;const ts=Math.floor(el/60)+':'+String(Math.floor(el%60)).padStart(2,'0');if(ts!==lastTm){lastTm=ts;$('tm').textContent=ts}
  FX.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt});FX=FX.filter(f=>f.l>0);
  TX.forEach(t=>{t.y-=22*dt;t.l-=dt});TX=TX.filter(t=>t.l>0);SW.forEach(s=>s.t-=dt);SW=SW.filter(s=>s.t>0);
  if(net&&net.role==='c')netApply(dt);else if(state==='play')update(dt*SPEED);
  draw();hud();netSend();requestAnimationFrame(loop);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='play')turn(me)});

const b36=(n,l)=>Math.max(0,Math.min(Math.pow(36,l)-1,Math.round(n))).toString(36).padStart(l,'0');
function stat(t){$('onst').textContent=t}
// claude.ai上ではroom機能、自前サーバー(Render等)上ではWebSocket中継を使う
function wsJoin(name,opts){return new Promise((resolve,reject)=>{
  let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){return reject(new Error('ws'))}
  let myId=null,peers=new Map(),cbs=[],done=false;
  const fire=()=>cbs.forEach(cb=>{try{cb({})}catch(e){}});
  const room={presence(patch){if(ws.readyState===1)ws.send(JSON.stringify({t:'p',d:patch}));return Promise.resolve()},
    peers(){return [...peers.entries()].map(([id,pr])=>({isMe:id===myId,presence:pr,peer:id}))},
    onPeers(cb){cbs.push(cb);cb({});return()=>{}},
    leave(){try{ws.close()}catch(e){}return Promise.resolve()}};
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:name,create:!!(opts&&opts.create)}));
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==='joined'){myId=m.id;done=true;resolve(room)}
    else if(m.t==='peers'){peers=new Map(m.list.map(q=>[q.id,q.presence]));fire()}
    else if(m.t==='pu'){peers.set(m.id,Object.assign({},peers.get(m.id)||{},m.d));fire()}
    else if(m.t==='err'){reject(new Error(m.msg))}};
  ws.onerror=()=>{if(!done)reject(new Error('ws'))};
  ws.onclose=()=>{if(!done)reject(new Error('closed'));else{peers=new Map();fire()}};
})}
async function onInit(){if(RM!==null)return RM;try{RM=(window.claude&&window.claude.use?await window.claude.use('room'):{join:wsJoin})||false}catch(e){RM=false}return RM}
const errMsg=(e,d)=>{const m=e&&e.message;return m==='notfound'?'部屋が見つかりません。コードを確かめてね。':m==='full'?'この部屋はいっぱいです。':(m==='ws'||m==='closed')?'サーバーにつながりません。少し待ってからもう一度試してね。（無料サーバーは起動に1分ほどかかります）':d}
const pickMy=()=>sel<0?Math.floor(Math.random()*CH.length):sel;
function netLeave(){try{if(roomN)roomN.leave()}catch(e){}roomN=null;net=null}
function netEv(e){net.ev.push([++net.eid,...e]);if(net.ev.length>16)net.ev.shift()}
function netIn(t,i){net.iq.push([++net.is,t,i]);net.iq=net.iq.slice(-6);roomN.presence({in:net.iq})}
function showScr(id){['st','modesel','title','onlp'].forEach(x=>$(x).classList.add('hidden'));if(id)$(id).classList.remove('hidden')}
function setOnlineUI(on){$('title').classList.toggle('online',on);$('sec-opp').classList.toggle('hidden',on);$('sec-diff').classList.toggle('hidden',on);
  $('modes').classList.toggle('hidden',on&&!(net&&net.role==='h'));$('olst').classList.toggle('hidden',!on);$('go').disabled=false;
  $('go').textContent=on?(net&&net.role==='h'?'はじめる':'準備OK'):'バトルスタート'}
function refreshCS(){if(!net||net.ph!=='cs')return;const q=roomN.peers().find(p=>!p.isMe&&p.presence.r===(net.role==='h'?'g':'h'));
  if(net.role==='h'){const rdy=!!(q&&q.presence.rdy);$('go').disabled=!rdy;$('go').textContent=rdy?'はじめる':'はじめる（相手を待っています）';$('olst').textContent='部屋コード '+net.code+'\n'+(rdy?'ともだち：準備OK！':'ともだち：キャラを選んでいます…')}
  else{$('go').textContent=net.rdy?'準備OK！（取り消す）':'準備OK';$('olst').textContent=net.rdy?'準備OK！ホストの開始を待っています…':'キャラを選んで「準備OK」を押してね'}}
function enterCS(){net.ph='cs';net.rdy=0;setOnlineUI(true);showScr('title');refreshCS()}
async function openOnline(){au();setOnlineUI(false);showScr('onlp');stat('つないでいます…');const r=await onInit();stat(r?'部屋を作る（ホスト）か、ともだちの4けたのコードを入れて入室してね。':'この環境ではオンライン対戦を使えません。サインインした状態で、共有されたリンクから開いてください。')}
$('hstart').onclick=()=>{au();mbgm(true);showScr('modesel')};
$('mbk').onclick=()=>showScr('st');
$('mcpu').onclick=()=>{setOnlineUI(false);showScr('title')};
$('mon').onclick=openOnline;
$('tbk').onclick=()=>{if(net){netLeave();setOnlineUI(false)}showScr('modesel')};
$('onbk').onclick=()=>{netLeave();showScr('modesel')};
spr($('hc').getContext('2d'),'star',54,54,12,'#ffd23f');
function onPeersH(){if(!net||net.role!=='h')return;const gp=roomN.peers().find(q=>!q.isMe&&q.presence.r==='g');
  if(net.ph==='lobby'){if(gp)enterCS();else stat('部屋コード：'+net.code+'\nともだちの入室を待っています…')}
  else if(net.ph==='cs'){if(!gp){net.ph='lobby';roomN.presence({ph:'lobby'});setOnlineUI(false);showScr('onlp');stat('ともだちが退出しました。\n部屋コード：'+net.code+'\n入室を待っています…')}else refreshCS()}
  else if(!gp&&!net.gone&&(state==='play'||state==='cut')){net.gone=1;finish(me)}}
function onPeersG(){if(!net)return;const hp=roomN.peers().find(q=>!q.isMe&&q.presence.r==='h');
  if(!hp){if(net.ph==='play'&&(state==='play'||state==='cut')&&!net.gone){net.gone=1;cliFinish(true)}else if(net.ph==='lobby')stat('ホストを探しています…');else if(net.ph==='cs'){netLeave();setOnlineUI(false);showScr('onlp');stat('ホストが退出しました。')}return}
  const pr=hp.presence;
  if(net.ph==='lobby')enterCS();
  if(net.ph==='cs')refreshCS();
  if(pr.go&&pr.gid>net.gid){net.gid=pr.gid;net.opp=pr.ch;mode=pr.md;net.ph='play';net.started=true;net.role='c';net.gone=0;net.lastN=-1;net.lastE=0;$('res').classList.add('hidden');start(CH[net.my])}}
$('onmk').onclick=async()=>{if(!RM)return;netLeave();let code='';
  let lastErr=null;for(let i=0;i<6&&!roomN;i++){code=String(1000+Math.floor(Math.random()*9000));try{roomN=await RM.join('sv'+code,{create:true})}catch(e){lastErr=e;if(!(e&&e.message==='exists'))break}}
  if(!roomN){stat(errMsg(lastErr,'部屋を作れませんでした。もう一度試してね。'));return}
  net={role:'h',ph:'lobby',code,my:0,opp:0,gid:0,lastIn:0,seq:0,eid:0,ev:[],lt:0,started:false,gone:0,rdy:0,seenTX:new WeakSet(),seenSW:new WeakSet()};
  roomN.presence({r:'h',ph:'lobby',gid:0,go:0});roomN.onPeers(onPeersH);stat('部屋コード：'+code+'\nともだちの入室を待っています…')};
$('onjn').onclick=async()=>{if(!RM)return;const code=$('oncode').value.trim();if(!/^[0-9]{4}$/.test(code)){stat('4けたの数字を入れてね。');return}
  netLeave();try{roomN=await RM.join('sv'+code)}catch(e){stat(errMsg(e,'入室できませんでした。コードを確かめてね。'));return}
  net={role:'g',ph:'lobby',code,my:0,opp:0,gid:0,is:0,iq:[],started:false,gone:0,lastN:-1,lastE:0,rdy:0};
  roomN.presence({r:'g',rdy:0,in:[]});roomN.onPeers(onPeersG);stat('ホストを探しています…')};
function netRestart(){net.gid++;net.gone=0;roomN.presence({gid:net.gid,go:1});$('res').classList.add('hidden');start(CH[net.my])}
const BLK=Object.keys(BL);
const blmask=p=>BLK.reduce((m,k,i)=>m|(p.bl[k]?1<<i:0),0);
const unbl=m=>{const o={};BLK.forEach((k,i)=>{if(m>>i&1)o[k]=1});return o};
function pk(p){const t=performance.now();return[Math.round(p.x),Math.round(p.y),p.dir,p.pts,+(p.chg/1.2).toFixed(2),p.st,p.hp,p.inv>0?1:0,t<p.cu?1:0,t<p.fz?1:0,Math.round(p.love*10)/10,p.bow?1:0,p.held?p.held.hp:0,p.held?p.held.s:0,blmask(p),p.stk,p.dead?1:0,p.cats.map(c=>[Math.round(c.x),Math.round(c.y)])]}
function netSend(){
  if(!net||net.role!=='h'||!net.started||!(state==='play'||state==='cut'||state==='over'))return;
  const g=roomN.peers().find(q=>!q.isMe&&q.presence.r==='g');
  if(g&&g.presence.in)for(const e of g.presence.in)if(e[0]>net.lastIn){net.lastIn=e[0];if(state==='play'){if(e[1]==='s')skill(cpu,e[2]);else turn(cpu)}}
  const t=performance.now();if(t-net.lt<48)return;net.lt=t;
  for(const x of TX)if(!net.seenTX.has(x)){net.seenTX.add(x);netEv(['t',Math.round(x.x),Math.round(x.y),x.s,x.c])}
  for(const s of SW)if(!net.seenSW.has(s)){net.seenSW.add(s);
    if(s.bm)netEv(['b',Math.round(s.bm.x),Math.round(s.bm.y1),Math.round(s.bm.y2),s.bm.c,s.t]);
    else if(s.cat)netEv(['k',Math.round(s.cat.x),Math.round(s.cat.y),s.cat.c]);
    else if(s.p)netEv(['a',s.p===me?0:1,s.d])}
  let bs='',n=0;
  for(const b of B){if(b.dead||(b.hid&&Math.abs(b.y-b.y0)<150))continue;if(++n>380)break;
    const f=(b.own===me?0:1)|(b.heavy?2:0)|(b.slash?4:0)|(b.gate&&!b.go?8:0)|(b.rb?16:0)|(b.c==='#ffd23f'?32:0);
    bs+=b36(b.x+200,2)+b36(b.y+200,2)+b36(Math.min(35,b.r),1)+b36(f,2)}
  const sn={n:++net.seq,g:[state==='over'?1:state==='cut'?2:0,cpu.dead?0:1,Math.round(el*10)/10,T>10?1:0],p:[pk(me),pk(cpu)],bu:bs,
    bx:BX.filter(b=>!b.dead).map(b=>[Math.round(b.x),Math.round(b.y),b.s,b.hp,b.star?1:0,b.last?(b.last===me?0:1):-1]),
    st:ST.map(s=>[Math.round(s.x),Math.round(s.y),s.own===me?0:1,s.sp?1:0]),
    sh:SH.map(s=>[Math.round(s.x),Math.round(s.y),s.w,Math.round(s.t*10)/10,s.own===me?0:1]),ev:net.ev.slice()};
  let js=JSON.stringify(sn);while(js.length>3800&&bs.length>70){bs=bs.slice(0,bs.length-70);sn.bu=bs;js=JSON.stringify(sn)}
  roomN.presence({sn});
}
function decB(str){const out=[];for(let i=0;i+7<=str.length;i+=7){const f=parseInt(str.substr(i+5,2),36),own=(f&1)?me:cpu;
  out.push({x:parseInt(str.substr(i,2),36)-200,y:H-(parseInt(str.substr(i+2,2),36)-200),r:parseInt(str[i+4],36),own,c:(f&32)?'#ffd23f':own.col,heavy:!!(f&2),slash:!!(f&4),gate:(f&8)?1:0,go:false,rb:(f&16)?1:0})}return out}
function applyP(tg,a){tg.tx=a[0];tg.ty=H-a[1];tg.dir=a[2];tg.pts=a[3];tg.chg=a[4]*1.2;tg.st=a[5];tg.hp=a[6];
  tg.inv=a[7]?(Date.now()%200<100?.1:.2):0;const t=performance.now();tg.cu=a[8]?t+500:0;tg.fz=a[9]?t+500:0;tg.love=a[10];tg.bow=!!a[11];
  tg.held=a[12]?{hp:a[12],s:a[13]}:null;tg.bl=unbl(a[14]);tg.stk=a[15];tg.dead=!!a[16];tg.cats=a[17].map(c=>({x:c[0],y:H-c[1]}))}
function cliFinish(win){if(state==='over')return;state='over';bgm(false);sfx(win?'win':'lose');
  setTimeout(()=>{$('rt').textContent=win?'YOU WIN!':'YOU LOSE';$('rd').textContent=win?'ナイスショット！':'次は弾の動きを読もう（ホストの再開を待っています）';$('res').classList.remove('hidden')},900)}
function netApply(dt){
  const hp=roomN&&roomN.peers().find(q=>!q.isMe&&q.presence.r==='h'),sn=hp&&hp.presence.sn;
  if(sn&&sn.n!==net.lastN&&(state==='play'||state==='cut'||state==='over')){net.lastN=sn.n;
    applyP(cpu,sn.p[0]);applyP(me,sn.p[1]);B=decB(sn.bu);
    BX=sn.bx.map(a=>({x:a[0],y:H-a[1],s:a[2],hp:a[3],star:!!a[4],last:a[5]<0?null:(a[5]===1?me:cpu)}));
    ST=sn.st.map(a=>({x:a[0],y:H-a[1],own:a[2]===1?me:cpu,sp:!!a[3]}));
    SH=sn.sh.map(a=>({x:a[0],y:H-a[1],w:a[2],t:a[3],own:a[4]===1?me:cpu}));
    for(const e of sn.ev)if(e[0]>net.lastE){net.lastE=e[0];const k=e[1];
      if(k==='s')sfx(e[2],e[3]===1?me:e[3]===0?cpu:undefined);
      else if(k==='t')TX.push({x:e[2],y:H-e[3],s:e[4],c:e[5],l:1});
      else if(k==='b')SW.push({bm:{x:e[2],y1:H-e[3],y2:H-e[4],c:e[5]},t:e[6]});
      else if(k==='k')SW.push({cat:{x:e[2],y:H-e[3],c:e[4]},t:.3});
      else if(k==='a')SW.push({p:e[2]===1?me:cpu,d:e[3],t:.25});
      else if(k==='c'){showCut(e[2]===1?me:cpu);setTimeout(()=>$('cut').classList.add('hidden'),1300)}}
    $('warn').classList.toggle('hidden',!sn.g[3]);el=sn.g[2];
    if(sn.g[0]===1)cliFinish(sn.g[1]===1);
  }
  for(const p of[me,cpu])if(p.tx!==undefined){p.x+=(p.tx-p.x)*.45;p.y+=(p.ty-p.y)*.45}
}
$('again').onclick=()=>{if(net){if(net.role==='h')netRestart();return}start(sel<0?CH[Math.random()*CH.length|0]:CH[sel])};

$('home').onclick=()=>{netLeave();setOnlineUI(false);bgm(false);state='title';$('res').classList.add('hidden');$('game').classList.add('hidden');showScr('modesel')};
